<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Ease</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Legal Ease</h1>
    <p class="subtitle">AI-Powered Legal Document Generator</p>

    <form action="/generate" method="POST" id="legalForm">
        <label>Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>Document Type</label>
        <select name="document_type" required>
            <option>Rental Agreement</option>
            <option>Affidavit</option>
            <option>Authorization Letter</option>
            <option>Employment Agreement</option>
        </select>

        <label>Purpose / Details</label>
        <textarea name="purpose" rows="5" placeholder="Enter the required details" required></textarea>

        <label>Date</label>
        <input type="date" name="date" required>

        <button type="submit">Generate Document</button>
    </form>

    {% if document %}
    <section class="result">
        <h2>Generated Document</h2>
        <pre>{{ document }}</pre>

        <form action="/download" method="POST">
            <textarea name="document" hidden>{{ document }}</textarea>
            <button type="submit" class="download-btn">Download PDF</button>
        </form>
    </section>
    {% endif %}

    <p class="notice">
        Note: This application generates document templates for educational/project purposes.
        Users should obtain professional legal advice where appropriate.
    </p>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
